# MUSHIN CI (prepared 2026-10-16; not yet run: the repository has no GitHub remote). Mirrors the local gate:
# lint, typecheck, boundaries, every unit and integration test against disposable PostgreSQL 17 and Meilisearch,
# the frontend build and the bundle secret scan. No provider key is configured, so nothing can spend money.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mushin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_MASTER_KEY: ci-only-master-key-not-a-secret
          MEILI_ENV: development
        ports: ["7700:7700"]
    env:
      # Disposable CI services only; these values are not secrets.
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/mushin_test
      TEST_DATABASE_SSL_CA_FILE: ""
      MEILISEARCH_TEST_HOST: http://localhost:7700
      MEILISEARCH_TEST_KEY: ci-only-master-key-not-a-secret
      LLM_MONTHLY_BUDGET_USD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Install (frontend)
        run: npm ci --prefix frontend
      - name: Lint, typecheck, boundaries, unit and integration tests
        run: npm run verify
      - name: Frontend typecheck
        run: npx tsc --noEmit -p frontend/tsconfig.json
      - name: Frontend build
        run: npm --prefix frontend run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      - name: Bundle secret scan (AUTH-002)
        run: node --import tsx scripts/check-bundle-secrets.ts frontend/dist

  # Supabase target (migration map stages 1-2): the CLI copy of the migrations is in sync, a local Supabase database
  # builds from scratch, and the whole suite passes on Supabase's PostgreSQL. Prepared 2026-10-16, not yet run in CI
  # (run locally: supabase db reset --local, then TEST_DATABASE_URL=...:54322/mushin_supabase_test npm test).
  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54322/mushin_supabase_test
      TEST_DATABASE_SSL_CA_FILE: ""
      LLM_MONTHLY_BUDGET_USD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install (workspaces)
        run: npm ci
      - name: Supabase migrations match packages/db/migrations
        run: node --import tsx scripts/supabase/sync-migrations.ts --check
      - name: Build a local Supabase database from scratch
        run: supabase db start && supabase db reset --local
      - name: Disposable test database on Supabase PostgreSQL
        run: PGPASSWORD=postgres createdb -h localhost -p 54322 -U postgres mushin_supabase_test && DIRECT_URL=postgres://postgres:postgres@localhost:54322/mushin_supabase_test DATABASE_SSL_CA_FILE= node --import tsx packages/db/src/migrate-cli.ts
      - name: Unit and integration tests on Supabase PostgreSQL
        run: npm test
